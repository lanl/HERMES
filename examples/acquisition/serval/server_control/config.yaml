measurement_info:
  measurement_id: example-serval-stage0
  run: server-control

environment:
  working_directory: data/examples/acquisition/serval/stage0
  log_directory: logs

acquisition:
  mode: serval
  config:
    serval:
      url: http://localhost:8080
      # Set this to the SERVAL .jar on your machine.
      program_path: /path/to/serval-3.3.0.jar
      version: "3.3.0"
      # Uncomment to point SERVAL at one camera by TCP address (SERVAL 3.0+);
      # leave both unset to let SERVAL autodiscover the camera.
      # tcp_ip: 192.168.100.1
      # tcp_port: 50000
