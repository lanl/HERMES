measurement_info:
  measurement_id: example-tpx3-unpacking-single-file
  run: single-file

environment:
  working_directory: data/examples/analysis/unpacking/single_file
  analysis_directory: analysis

analysis:
  mode: hermes
  unpacking:
    program:
      name: tpx3-spidr-cpp
      executable_path: build/backends/tpx3-spidr/hermes-tpx3-spidr
    runtime_options:
      overwrite: true
    tpx3_files:
      - path: tests/data/tpx3/Example_1kHz_5frames.tpx3
