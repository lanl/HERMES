# HERMES record — Example 03: unpacking + photon + event reconstruction (quad)

measurement_info:
  measurement_id: harness-03-event-quad
  run: quad-sample

environment:
  working_directory: data/03-event-quad
  run_directory: quad-sample
  log_directory: logs
  raw_data_directory: tests/data/tpx3
  analysis_directory: analysis
  config_file: HERMES_record.yaml

analysis:
  mode: hermes
  resource_limit_percent: 90
  detector_layout:
    kind: quad
  unpacking:
    program:
      name: tpx3-spidr-cpp
      executable_path: hermes-tpx3-spidr
    tpx3_files:
      - path: tests/data/tpx3/quad.tpx3

  photon_reconstruction:
    program:
      name: photon-clusterer-cpp
      executable_path: hermes-photon-clusterer
      version: null
    pixel_files: auto
    clustering_algorithm:
      name: connected_components
      save_photon_pixels: true
      settings:
        max_time_spread_ticks: 98304
        min_cluster_size: 2
        max_cluster_size: 64
        min_pixel_tot_raw: 1
        min_cluster_tot_raw: 2
        max_cluster_tot_raw: 500
        max_aspect_ratio: 3.0
        min_filled_fraction: 0.5
        adjacency: 8
        position_averaging: arithmetic
        photon_time_estimator: leading_edge
        timewalk_calibration_file: calibrations/tpx3/time-walk_example.json

  event_reconstruction:
    program:
      name: event-reconstructor-cpp
      executable_path: hermes-event-reconstructor
      version: null
    photon_parquet_files: auto
    clustering_algorithm: connected_components
    settings:
      spatial_link_radius_pixels: 10.0
      spatial_cells_per_axis: 5
      max_time_difference_ticks: 4915200.0
      max_event_duration_ticks: 14745600.0
      min_photon_count: 1
      save_event_photons: true
