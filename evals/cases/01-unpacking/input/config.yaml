# HERMES record — Example 01: unpacking only

measurement_info:
  measurement_id: harness-01-unpacking
  run: 1kHz-testing

environment:
  working_directory: data/01-unpacking
  run_directory: 1kHz-testing
  log_directory: logs
  raw_data_directory: tests/data/tpx3
  analysis_directory: analysis
  config_file: HERMES_record.yaml

analysis:
  mode: hermes
  resource_limit_percent: 90
  unpacking:
    program:
      name: tpx3-spidr-cpp
      executable_path: build/backends/tpx3-spidr/hermes-tpx3-spidr
    tpx3_files:
      - path: tests/data/tpx3/Example_1kHz_5frames.tpx3
