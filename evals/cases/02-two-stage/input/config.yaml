# HERMES record — Example 02: unpacking + photon reconstruction

measurement_info:
  measurement_id: harness-02-two-stage
  run: tantalum-ironpowder

environment:
  working_directory: data/02-two-stage
  run_directory: data/02-two-stage/tantalum-ironpowder
  log_directory: data/02-two-stage/tantalum-ironpowder/logs
  raw_data_directory: tests/data/tpx3
  analysis_directory: data/02-two-stage/tantalum-ironpowder/analysis
  config_file: data/02-two-stage/tantalum-ironpowder/HERMES_record.yaml

analysis:
  mode: hermes
  resource_limit_percent: 90
  unpacking:
    program:
      name: tpx3-spidr-cpp
      executable_path: build/backends/tpx3-spidr/hermes-tpx3-spidr
    tpx3_files:
      - path: tests/data/tpx3/Tantalum_IronPowder.tpx3
    unpacked_output_directory: data/02-two-stage/tantalum-ironpowder/analysis

  photon_reconstruction:
    program:
      name: photon-clusterer-cpp
      executable_path: build/backends/photon-clusterer/hermes-photon-clusterer
      version: null
    pixel_data_directory: data/02-two-stage/tantalum-ironpowder/analysis/pixel_hits
    pixel_files: auto
    photon_output_directory: data/02-two-stage/tantalum-ironpowder/analysis/photons
    clustering_algorithm:
      name: connected_components
      save_photon_pixels: true
      settings:
        max_time_spread_ticks: 98304
        min_cluster_size: 2
        max_cluster_size: 64
        min_pixel_tot_raw: 1
        min_cluster_tot_raw: 2
        max_cluster_tot_raw: 500
        max_aspect_ratio: 3.0
        min_filled_fraction: 0.5
        adjacency: 8
        position_averaging: arithmetic
        photon_time_estimator: leading_edge
        timewalk_calibration_file: calibrations/tpx3/time-walk_example.json
