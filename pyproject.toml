[project]
authors = [{name = "Alexander M. Long", email = "alexlong@lanl.gov"}]
name = "hermes"
requires-python = ">= 3.11"
version = "3.3.5"
dependencies = [
  "pydantic>=2.13,<3",
  "loguru",
  "pyyaml",
  "pyarrow>=18",
  "numpy>=2.5",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "psutil>=6",
  "httpx>=0.28,<0.29",
  "mcp>=2,<3",
]

[project.scripts]
hermes-mcp = "hermes.mcp.server:main"
hermes-mcp-setup = "hermes.mcp.setup:main"

[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10"]

# The C++ backends compile from source at install time. cmake finds the
# compiler on PATH and the C++ libraries (nlohmann_json, Arrow) through the
# active environment, so a consumer's pixi project must provide those build
# tools and libraries as conda dependencies (see README).
[tool.scikit-build]
wheel.packages = ["src/hermes"]
cmake.build-type = "Release"
cmake.version = ">=3.20"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.scikit-build.env]
CMAKE_PREFIX_PATH = { env = "CMAKE_PREFIX_PATH", default = "" }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64","linux-64"]

[tool.pixi.pypi-options]
index-url = "https://nexus.lanl.gov/repository/python/simple"
extra-index-urls = ["https://pypi.org/simple"]

[tool.pixi.pypi-dependencies]
hermes = { path = ".", editable = true }

[tool.pixi.tasks]
hermes-mcp = "hermes-mcp"
hermes-mcp-setup = "hermes-mcp-setup"
build-cpp-unpacker = "cmake -S src/backends/unpackers/tpx3-spidr/cpp -B build/backends/tpx3-spidr -DCMAKE_BUILD_TYPE=Release && cmake --build build/backends/tpx3-spidr"
test-cpp-unpacker = { cmd = "ctest --test-dir build/backends/tpx3-spidr --output-on-failure", depends-on = ["build-cpp-unpacker"] }
build-cpp-photon-clusterer = "cmake -S src/backends/reconstruction/photons/cpp -B build/backends/photon-clusterer -DCMAKE_BUILD_TYPE=Release && cmake --build build/backends/photon-clusterer"
test-cpp-photon-clusterer = { cmd = "ctest --test-dir build/backends/photon-clusterer --output-on-failure", depends-on = ["build-cpp-photon-clusterer"] }
build-cpp-event-reconstructor = "cmake -S src/backends/reconstruction/events/connected-components/cpp -B build/backends/event-reconstructor -DCMAKE_BUILD_TYPE=Release && cmake --build build/backends/event-reconstructor"
test-cpp-event-reconstructor = { cmd = "ctest --test-dir build/backends/event-reconstructor --output-on-failure", depends-on = ["build-cpp-event-reconstructor"] }

[tool.pixi.dependencies]
python = ">=3.14.4,<3.15"
pydantic = ">=2.13.3,<3"
pytest = "*"
loguru = "*"
pyYAML = "*"
pyarrow = ">=18.0.0"
nlohmann_json = ">=3.11.0"
psutil = ">=6.0.0"
matplotlib = ">=3.11.1"
numpy = ">=2.5.1"
pandas = ">=2.2"
ffmpeg = ">=6.0"
# C++ build tools for compiling the backends from source on any platform.
cxx-compiler = "*"
cmake = ">=3.20"
ninja = "*"
httpx = ">=0.28.1,<0.29"
